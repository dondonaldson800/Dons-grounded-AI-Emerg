name: Master Release Packaging Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: "Don's Grounded AI Empire Official Release"

jobs:
  release:
    name: Package and Publish Official Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm run build

      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/build.gradle" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon

      - name: Prepare Release Assets
        run: |
          mkdir -p release-artifacts
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/DonsGroundedAI-${TAG}.apk || true
          cp android/app/build/outputs/bundle/debug/app-debug.aab release-artifacts/DonsGroundedAI-${TAG}.aab || true
          if [ -f "export_all_store_skus.json" ]; then
            cp export_all_store_skus.json release-artifacts/
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
